<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>coderz Open Day</title>
    </head>
    <body>
        <h1>coderz Open Day</h1>
    <table>
            <caption>Visitors by room and time</caption>
        <thead>
            <tr>
                <th scope="col">Room</th>
                <th scope="col">Time</th>
                <!---<td>Visitors</td> لأنو عباره عن عامود في الجدول-->
                <th scope="col">Visitors</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <!-- تغيير rowspan=1 to rowspan=2 لعملية دمج سطرين مع بعض-->
                <th scope="rowgroup" rowspan="2">Lab A</th>
                <td>Morning</td><td>12</td>
            </tr>
                <tr><td>Evening</td><td>8</td></tr>
       <!-- </tbody> tbody only one time on the one table
        <tbody>-->
                <tr>
                    <th scope="row">Lab B</th>
                    <td>Morning</td><td>5</td>
                </tr>
        </tbody>
        <tfoot>
                <!--<tr><th scope="row">Total visitors</th><td>23</td></tr>
                colspan=2 لعملية دمج عامودين مع بعض، تغيير المجموع ل27-->
                <tr><th scope="row" colspan="2">Total visitors</th><td>27</td></tr>
        </tfoot>
    </table>
</body>
</html>
